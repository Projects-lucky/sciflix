name: sciflix CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        run: npm install -g pnpm@9

      - name: Install Project Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript Type Check & Build
        run: pnpm run build
        env:
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
          TMDB_ACCESS_TOKEN: dummy
          TMDB_API_READ_ACCESS_TOKEN: dummy
          NEXT_PUBLIC_TMDB_API_BASE_URL: https://api.themoviedb.org/3
          NEXT_PUBLIC_TMDB_IMAGE_BASE_URL: https://image.tmdb.org/t/p
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: dummy
          CLERK_SECRET_KEY: dummy