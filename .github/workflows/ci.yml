name: sciflix CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install pnpm
        run: npm install -g pnpm@8

      - name: Install Project Dependencies
        run: pnpm install

      - name: Run TypeScript Type Check & Build
        run: pnpm run build